<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>ass</title>
    <meta name="description" content="Gluteus maximus." />
    <link rel="canonical" href="https://ass.jass.gg/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ass.jass.gg/" />
    <meta property="og:site_name" content="ass" />
    <meta property="og:title" content="ass" />
    <meta property="og:description" content="Gluteus maximus." />
    <meta property="og:image" content="https://ass.jass.gg/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ass" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ass" />
    <meta name="twitter:description" content="Gluteus maximus." />
    <meta name="twitter:image" content="https://ass.jass.gg/og.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VisualArtwork",
        "name": "ass",
        "url": "https://ass.jass.gg/",
        "image": "https://ass.jass.gg/og.png",
        "artform": "Sculpture",
        "artMedium": "Simulated flesh",
        "artworkSurface": "Void",
        "abstract": "Gluteus maximus."
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      /* a still of the same frame holds the void while the GPU warms up,
         and stays if it never does */
      #poster {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      #poster img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      html[data-ready="true"] #poster {
        opacity: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        #poster {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <picture id="poster" aria-hidden="true">
      <source media="(max-aspect-ratio: 3/4)" srcset="/poster/portrait.jpg" />
      <img src="/poster/desktop.jpg" alt="" fetchpriority="high" decoding="async" />
    </picture>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
