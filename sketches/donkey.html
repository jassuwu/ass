<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ASS.</title>
<meta name="description" content="It's a donkey. What did you think it was?" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #060606; overflow: hidden; }
  body {
    font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, serif;
    color: #e9e4da;
    -webkit-font-smoothing: antialiased;
  }
  #scene { position: fixed; inset: 0; display: block; cursor: grab; }
  #scene:active { cursor: grabbing; }

  .ui { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; }

  header {
    text-align: center;
    padding-top: clamp(1.2rem, 4vh, 3rem);
  }
  h1 {
    font-size: clamp(4.5rem, 18vw, 14rem);
    font-weight: 400;
    letter-spacing: 0.08em;
    line-height: 0.9;
    color: #f2ede2;
    text-shadow: 0 0 80px rgba(255, 240, 210, 0.15);
    user-select: none;
  }
  h1 .dot { color: #b08d4f; }
  .tagline {
    margin-top: 1rem;
    font-style: italic;
    font-size: clamp(0.9rem, 2vw, 1.25rem);
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: #9a917f;
  }

  footer {
    margin-top: auto;
    text-align: center;
    padding-bottom: clamp(1rem, 3.5vh, 2.5rem);
  }
  .hint {
    font-size: 0.8rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: #6e6759;
    margin-bottom: 0.9rem;
  }
  .legal {
    font-size: 0.7rem;
    letter-spacing: 0.12em;
    color: #4d483e;
  }

  .fact {
    position: fixed;
    left: 50%;
    bottom: 18%;
    transform: translateX(-50%);
    font-style: italic;
    font-size: clamp(0.85rem, 1.6vw, 1.1rem);
    color: #b8ae9a;
    letter-spacing: 0.05em;
    opacity: 0;
    transition: opacity 1.2s ease;
    text-align: center;
    max-width: 34em;
    padding: 0 1rem;
    pointer-events: none;
  }
  .fact.show { opacity: 1; }

  /* the reveal — fades out once, on first load */
  #veil {
    position: fixed; inset: 0;
    background: #060606;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 1.5rem;
    z-index: 10;
    transition: opacity 1.6s ease;
  }
  #veil.gone { opacity: 0; pointer-events: none; }
  #veil p {
    font-style: italic;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: clamp(0.8rem, 2vw, 1rem);
    color: #9a917f;
  }
  #enter {
    pointer-events: auto;
    font-family: inherit;
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    letter-spacing: 0.4em;
    text-transform: uppercase;
    background: none;
    color: #e9e4da;
    border: 1px solid #6e6759;
    padding: 1rem 3rem 1rem 3.4rem;
    cursor: pointer;
    transition: background 0.4s, color 0.4s;
  }
  #enter:hover { background: #e9e4da; color: #060606; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div class="ui">
  <header>
    <h1>ASS<span class="dot">.</span></h1>
    <div class="tagline">yes. really.</div>
  </header>
  <footer>
    <div class="hint">drag to inspect the ass from every angle &mdash; click it to hear its truth</div>
    <div class="legal">&copy; ASS. No rights reserved. Free, as an ass in the wild. It was a donkey the whole time.</div>
  </footer>
</div>

<div class="fact" id="fact"></div>

<div id="veil">
  <p>you are about to witness an ass</p>
  <button id="enter">behold</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x060606);
scene.fog = new THREE.Fog(0x060606, 9, 22);

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
camera.position.set(5.2, 2.6, 6.4);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.55, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.9;
controls.minDistance = 3.5;
controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * 0.55;
controls.enablePan = false;

// ---------- lighting: fragrance-ad gravitas ----------
scene.add(new THREE.HemisphereLight(0x353128, 0x0a0a0a, 0.55));

const key = new THREE.SpotLight(0xfff0d8, 260, 40, Math.PI / 5.5, 0.45, 1.8);
key.position.set(4, 9, 3);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0004;
scene.add(key);

const rim = new THREE.SpotLight(0x8fa3c8, 90, 40, Math.PI / 5, 0.6, 1.8);
rim.position.set(-5, 4, -4);
scene.add(rim);

// ---------- stage ----------
const ground = new THREE.Mesh(
  new THREE.CircleGeometry(30, 64),
  new THREE.MeshStandardMaterial({ color: 0x0d0c0b, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const pedestal = new THREE.Mesh(
  new THREE.CylinderGeometry(2.4, 2.7, 0.35, 64),
  new THREE.MeshStandardMaterial({ color: 0x171512, roughness: 0.4, metalness: 0.3 })
);
pedestal.position.y = 0.175;
pedestal.receiveShadow = true;
pedestal.castShadow = true;
scene.add(pedestal);

// ---------- the ass itself ----------
const donkey = new THREE.Group();

const hide = new THREE.MeshStandardMaterial({ color: 0x8d8579, roughness: 0.85, flatShading: true });
const belly = new THREE.MeshStandardMaterial({ color: 0xb5ac9c, roughness: 0.9, flatShading: true });
const dark = new THREE.MeshStandardMaterial({ color: 0x3d3833, roughness: 0.8, flatShading: true });
const muzzleMat = new THREE.MeshStandardMaterial({ color: 0xd9d2c2, roughness: 0.9, flatShading: true });

function mesh(geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  donkey.add(m);
  return m;
}

// body (+x is forward)
mesh(new THREE.BoxGeometry(2.3, 1.15, 1.0), hide, 0, 1.7, 0);
mesh(new THREE.BoxGeometry(1.9, 0.5, 0.85), belly, 0, 1.18, 0); // belly
mesh(new THREE.BoxGeometry(0.7, 1.0, 1.02), hide, -0.95, 1.85, 0); // haunches

// legs + hooves
for (const [lx, lz] of [[0.85, 0.32], [0.85, -0.32], [-0.85, 0.32], [-0.85, -0.32]]) {
  mesh(new THREE.CylinderGeometry(0.13, 0.11, 1.15, 8), hide, lx, 0.75, lz);
  mesh(new THREE.CylinderGeometry(0.13, 0.15, 0.18, 8), dark, lx, 0.26, lz);
}

// neck + head
mesh(new THREE.BoxGeometry(0.55, 1.1, 0.55), hide, 1.15, 2.35, 0, 0, 0, -0.5);
const head = new THREE.Group();
head.position.set(1.55, 3.0, 0);
donkey.add(head);
function headMesh(geo, mat, x, y, z, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.castShadow = true;
  head.add(m);
  return m;
}
headMesh(new THREE.BoxGeometry(0.95, 0.55, 0.5), hide, 0.25, 0, 0, 0, 0, -0.25);
headMesh(new THREE.BoxGeometry(0.45, 0.42, 0.42), muzzleMat, 0.72, -0.14, 0, 0, 0, -0.25); // muzzle
// nostrils + eyes
headMesh(new THREE.SphereGeometry(0.035, 6, 6), dark, 0.92, -0.1, 0.12);
headMesh(new THREE.SphereGeometry(0.035, 6, 6), dark, 0.92, -0.1, -0.12);
headMesh(new THREE.SphereGeometry(0.055, 8, 8), dark, 0.28, 0.14, 0.26);
headMesh(new THREE.SphereGeometry(0.055, 8, 8), dark, 0.28, 0.14, -0.26);
// THE EARS. non-negotiable. this is what makes it an ass.
headMesh(new THREE.ConeGeometry(0.13, 0.75, 6), hide, -0.05, 0.6, 0.18, 0, 0, 0.15);
headMesh(new THREE.ConeGeometry(0.13, 0.75, 6), hide, -0.05, 0.6, -0.18, 0, 0, 0.15);

// mane, tail, tuft
mesh(new THREE.BoxGeometry(0.18, 0.95, 0.16), dark, 1.32, 2.6, 0, 0, 0, -0.5);
mesh(new THREE.CylinderGeometry(0.045, 0.03, 0.85, 6), hide, -1.32, 1.75, 0, 0, 0, 0.35);
mesh(new THREE.SphereGeometry(0.14, 6, 6), dark, -1.47, 1.36, 0);

donkey.position.y = 0.35;
donkey.rotation.y = -0.4;
scene.add(donkey);

// ---------- floating dust, for atmosphere ----------
const dustCount = 220;
const dustPos = new Float32Array(dustCount * 3);
for (let i = 0; i < dustCount; i++) {
  dustPos[i * 3] = (Math.random() - 0.5) * 12;
  dustPos[i * 3 + 1] = Math.random() * 6;
  dustPos[i * 3 + 2] = (Math.random() - 0.5) * 12;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xcbbfa4, size: 0.025, transparent: true, opacity: 0.5, depthWrite: false,
}));
scene.add(dust);

// ---------- the truth (hee-haw), synthesized ----------
let audioCtx = null;
function heehaw() {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const t0 = audioCtx.currentTime;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'sawtooth';
  osc.connect(gain).connect(audioCtx.destination);
  gain.gain.setValueAtTime(0, t0);
  // two hee-haw cycles: hee up high, haw down low
  for (let i = 0; i < 2; i++) {
    const t = t0 + i * 0.62;
    osc.frequency.setValueAtTime(340, t);
    osc.frequency.exponentialRampToValueAtTime(620, t + 0.22); // hee
    gain.gain.linearRampToValueAtTime(0.22, t + 0.06);
    gain.gain.linearRampToValueAtTime(0.1, t + 0.26);
    osc.frequency.exponentialRampToValueAtTime(150, t + 0.5);  // haw
    gain.gain.linearRampToValueAtTime(0.3, t + 0.36);
    gain.gain.linearRampToValueAtTime(0.001, t + 0.58);
  }
  osc.start(t0);
  osc.stop(t0 + 1.4);
}

// click the donkey → bray + a dignified little bounce
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let bounce = 0;
let downAt = 0;
canvas.addEventListener('pointerdown', () => { downAt = performance.now(); });
canvas.addEventListener('pointerup', (e) => {
  if (performance.now() - downAt > 250) return; // it was a drag, not a click
  pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  if (raycaster.intersectObject(donkey, true).length) {
    heehaw();
    bounce = 1;
  }
});

// ---------- rotating ass facts ----------
const facts = [
  'The ass was domesticated 6,000 years before you thought of this joke.',
  'An ass can carry twice the load of a horse its size. Respect the ass.',
  'Asses form lifelong friendships and grieve when separated. This ass is your friend now.',
  'The plural of ass is asses. Obviously.',
  '“This is a whole ass website.” — you, just now',
  'An ass’s bray can be heard over three kilometers away. Click it. You know you want to.',
  'Asses are not stubborn. They simply refuse to do stupid things. Unlike this website.',
];
const factEl = document.getElementById('fact');
let factIdx = 0;
function cycleFacts() {
  factEl.textContent = facts[factIdx % facts.length];
  factIdx++;
  factEl.classList.add('show');
  setTimeout(() => factEl.classList.remove('show'), 5200);
}
setInterval(cycleFacts, 6800);

// ---------- veil ----------
document.getElementById('enter').addEventListener('click', () => {
  document.getElementById('veil').classList.add('gone');
  heehaw();
  setTimeout(cycleFacts, 2500);
});

// ---------- loop ----------
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  // idle life: breathing, ear flicks, tail-ish sway via head tilt
  donkey.position.y = 0.35 + Math.sin(t * 1.4) * 0.02;
  head.rotation.z = Math.sin(t * 0.6) * 0.05;
  head.rotation.y = Math.sin(t * 0.35) * 0.08;
  if (bounce > 0) {
    donkey.scale.setScalar(1 + Math.sin(bounce * Math.PI) * 0.06);
    bounce = Math.max(0, bounce - 0.05);
  }
  const dp = dust.geometry.attributes.position;
  for (let i = 0; i < dustCount; i++) {
    let y = dp.getY(i) + 0.0035;
    if (y > 6) y = 0;
    dp.setY(i, y);
  }
  dp.needsUpdate = true;
  controls.update();
  renderer.render(scene, camera);
});
</script>
</body>
</html>
